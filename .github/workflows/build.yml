name: build

on:
  push:
    branches: ["oneplus15-mainline"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison libssl-dev libelf-dev bc device-tree-compiler kmod

      - name: Configure
        run: |
          make ARCH=arm64 defconfig
          # kaanapali.config = upstream stub; oneplus15-cn.config = PRIMARY
          # fragment (merged last, wins on conflicts): boot chain =y,
          # desktop peripherals =m -> shipped to rootfs via modules_install.
          ./scripts/kconfig/merge_config.sh -m .config \
            arch/arm64/configs/kaanapali.config \
            arch/arm64/configs/oneplus15-cn.config
          make ARCH=arm64 olddefconfig
          grep -E '^CONFIG_DRM_MSM=y|^CONFIG_SCSI_UFS_QCOM=y|^CONFIG_USB_CONFIGFS=y|^CONFIG_DRM_PANEL_ONEPLUS15_A0020=y|^CONFIG_QCOM_CPUCP_MBOX=y|^CONFIG_PHY_QCOM_EUSB2_REPEATER=y' .config

      - name: Build
        run: |
          set -o pipefail
          make ARCH=arm64 -j"$(nproc)" Image dtbs modules 2>&1 | tee build.log

      # Job logs API needs admin rights (403 for this account), so surface
      # the compile errors directly in the step summary on failure.
      - name: Publish build log on failure
        if: failure()
        run: |
          {
            echo '### Build failed — last 400 lines'
            echo '```'
            tail -n 400 build.log 2>/dev/null || echo 'no build.log produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|Error [0-9]|undefined reference" build.log 2>/dev/null | tail -n 50 || true

      - name: Upload build log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # Artifact download and job logs both need auth for this account.
      # Mirror build.log to a public branch so the raw URL is readable:
      #   https://raw.githubusercontent.com/PrestarLin/linux/ci-log/build.log
      - name: Push build log to ci-log branch
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s build.log || exit 0
          mkdir -p /tmp/ci-log && cd /tmp/ci-log
          git init -q -b ci-log
          cp "$GITHUB_WORKSPACE/build.log" .
          git config user.email 75038146@qq.com
          git config user.name ci-log
          git add -f build.log
          git commit -qm "run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-log --force
          echo "log mirrored to ci-log branch"

      - name: Bake stock memory map into dtb
        run: |
          # Upstream dts ships memory@a0000000 with size 0 (expects the
          # bootloader to patch it; SfbKernelBoot/mainlinedebug does not).
          # Zero RAM -> early crash -> device drops into 9008/EDL.
          # memory-map.txt = the exact usable-RAM segments from the stock
          # Android fdt (21 segments, verified cell-by-cell).
          DTB=arch/arm64/boot/dts/qcom/kaanapali-oneplus-infiniti.dtb
          fdtput -t x "$DTB" /memory@a0000000 reg $(cat .github/memory-map.txt)
          echo "memory reg now: $(fdtget -t x "$DTB" /memory@a0000000 reg | head -c 96) ..."
          # Master dts already ships /chosen (holds simple-framebuffer under it).
          # fdtput -c errors FDT_ERR_EXISTS on an EXISTING node, so probe with
          # `fdtget -p` and create only when missing (bit-exact replay of this
          # recipe against the raw upstream dtb passes 5/5). PatchChosen
          # (mainlinedebug/SfbKernelBoot) requires bootargs + linux,initrd-start/
          # end to all be present; if missing it fails into the (disabled) file
          # log and boot silently stops after the span line. bootargs gets a
          # 1025-byte placeholder (1024 a's + NUL), initrd slots start zeroed.
          fdtget -p "$DTB" /chosen >/dev/null 2>&1 || fdtput -c "$DTB" /chosen
          fdtput -t s "$DTB" /chosen bootargs "$(printf 'a%.0s' $(seq 1 1024))"
          fdtput -t x "$DTB" /chosen linux,initrd-start 0 0
          fdtput -t x "$DTB" /chosen linux,initrd-end 0 0
          echo "chosen bootargs bytes: $(fdtget "$DTB" /chosen bootargs | wc -c)"

      - name: Package
        run: |
          mkdir -p out
          cp arch/arm64/boot/Image out/
          cp .config out/config
          find arch/arm64/boot/dts/qcom -maxdepth 1 -name 'kaanapali*' \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp -v {} out/ \;
          {
            echo "kernel: $GITHUB_REPOSITORY branch $GITHUB_REF_NAME"
            echo "kernel-commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "date: $(date -u +%FT%TZ)"
            echo "runner: $RUNNER_ARCH"
          } > out/BUILD_INFO.txt
          tar -C out -czf kaanapali-mainline-build.tar.gz .
          ls -la out/

      # =m peripherals (touch/IR/audio userspace bits) ship to the rootfs:
      # rootfs-build.yml downloads this tarball and extracts it to /
      # so /lib/modules/<release> matches the booted kernel.
      - name: Install modules
        run: |
          make ARCH=arm64 modules_install INSTALL_MOD_PATH=modinstall
          rm -rf modinstall/lib/modules/*/build modinstall/lib/modules/*/source
          REL=$(ls modinstall/lib/modules)
          tar -C modinstall -czf out/kernel-modules.tar.gz lib
          echo "modules for $REL:"
          tar -tzf out/kernel-modules.tar.gz | grep -c '\.ko' || true
          ls -la out/kernel-modules.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaanapali-mainline
          path: out/
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mainline-latest
          name: "kaanapali mainline latest"
          prerelease: true
          body: |
            Rolling in-tree build of PrestarLin/linux branch `oneplus15-mainline`
            (based on infiniti-mainline/linux master 834ddc00f), configured with
            arch/arm64/configs/oneplus15-cn.config (primary; merged after the
            upstream kaanapali.config stub). Boot chain =y, desktop
            peripherals =m (modules land in rootfs via modules_install).
            Assets: Image + kaanapali*.dtb + config + kernel-modules.tar.gz
            (extract at / on the rootfs so /lib/modules/<release> matches).
            CI source tree: ${{ github.repository }}@${{ github.sha }}.
          files: |
            kaanapali-mainline-build.tar.gz
            out/*
