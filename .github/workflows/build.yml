name: build

on:
  push:
    branches: ["7.2"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison libssl-dev libelf-dev bc ccache device-tree-compiler systemd-ukify systemd-boot-efi busybox-static cpio

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.arch }}-

      - name: Configure
        run: |
          make ARCH=arm64 defconfig
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/kaanapali.config
          make ARCH=arm64 olddefconfig

      - name: Build Image
        run: make ARCH=arm64 -j"$(nproc)" CC="ccache gcc" Image

      - name: Build DTBs
        run: make ARCH=arm64 -j"$(nproc)" dtbs

      - name: Build UKIs
        run: |
          set -euo pipefail
          DTS=arch/arm64/boot/dts/qcom
          mkdir -p out

          # Debug initrd -- and the root: there is no root fs to hand off to,
          # so this ramdisk stays mounted as /. It brings up a USB CDC-ACM +
          # CDC-NCM gadget and a shell on ttyGS0 so a black screen can still
          # be observed from a PC (serial log + 192.168.42.1/24).
          mkdir -p initrd/bin initrd/dev initrd/proc initrd/sys
          cp /bin/busybox initrd/bin/busybox
          sudo mknod -m 600 initrd/dev/console c 5 1
          sudo mknod -m 666 initrd/dev/null c 1 3
          cat > initrd/init <<'INIT'
          #!/bin/busybox sh
          B=/bin/busybox

          $B mount -t proc proc /proc 2>/dev/null
          $B mount -t sysfs sysfs /sys 2>/dev/null
          $B mount -t devtmpfs devtmpfs /dev 2>/dev/null
          $B mount -t configfs configfs /sys/kernel/config 2>/dev/null

          # diag channel: locate recovery_a (/kb) for persistent logging
          # the cpio root has no /mnt; without this every mount fails and
          # the scan below silently logs nowhere
          $B mkdir -p /mnt
          STAGE=/dev/null
          KBDIR=""
          while read -r major minor blocks name; do
            case "$name" in
              ""|loop*|ram*|zram*|dm-*) continue ;;
            esac
            $B umount /mnt 2>/dev/null
            if $B mount -t vfat "/dev/$name" /mnt 2>/dev/null; then
              if $B [ -f /mnt/kb/kernel ]; then KBDIR="/dev/$name"; break; fi
              $B umount /mnt 2>/dev/null
            fi
          done < /proc/partitions
          if $B [ -n "$KBDIR" ]; then
            STAGE=/mnt/kb/stage.txt
            echo "init: mounts ok, kb=$KBDIR" > $STAGE 2>/dev/null
            : > /mnt/kb/kmsg.log 2>/dev/null
            $B cat /proc/kmsg >> /mnt/kb/kmsg.log 2>/dev/null &
            ( while :; do $B sync; $B sleep 2; done ) &
          fi
          echo "init-stage: mounts, kb=$KBDIR" > /dev/kmsg

          # kick deferred fbcon: any VT write hands the console over from dummy
          echo "kaanapali debug ramdisk" > /dev/tty1 2>/dev/null
          echo "init: banner written" >> $STAGE 2>/dev/null
          echo "init-stage: banner" > /dev/kmsg

          # --- USB gadget: CDC-ACM serial + CDC-NCM ethernet ---
          G=/sys/kernel/config/usb_gadget
          $B mkdir $G/g 2>/dev/null
          if $B [ -d $G/g ]; then
            cd $G/g
            echo 0x1d6b > idVendor
            echo 0x0104 > idProduct
            $B mkdir strings/0x409
            echo 0123456789 > strings/0x409/serialnumber
            echo xlie > strings/0x409/manufacturer
            echo debug > strings/0x409/product
            $B mkdir functions/acm.0
            $B mkdir functions/ncm.0
            $B mkdir configs/c.1
            $B mkdir configs/c.1/strings/0x409
            echo cfg > configs/c.1/strings/0x409/configuration
            $B ln -s functions/acm.0 configs/c.1/
            $B ln -s functions/ncm.0 configs/c.1/
            n=0
            UDC=
            while $B [ -z "$UDC" ] && $B [ $n -lt 10 ]; do
              UDC=$($B ls /sys/class/udc | $B head -n 1)
              $B [ -z "$UDC" ] && $B sleep 1
              n=$((n+1))
            done
            if $B [ -n "$UDC" ]; then
              echo "$UDC" > UDC
              echo usb-gadget: bound to $UDC > /dev/kmsg
            else
              echo usb-gadget: no UDC found > /dev/kmsg
            fi
          fi
          echo "init: gadget=$(if $B [ -d $G/g ]; then echo yes; else echo no; fi) UDC=$UDC" >> $STAGE 2>/dev/null
          echo "init-stage: gadget, UDC=$UDC" > /dev/kmsg

          $B sleep 2
          $B dmesg > /dev/ttyGS0 2>/dev/null &
          $B cat /proc/kmsg > /dev/ttyGS0 2>/dev/null &
          $B ifconfig usb0 192.168.42.1 netmask 255.255.255.0 up 2>/dev/null
          $B ifconfig usb1 192.168.42.1 netmask 255.255.255.0 up 2>/dev/null
          $B setsid $B sh -i < /dev/ttyGS0 > /dev/ttyGS0 2>&1 &

          # --- the ramdisk is the root: stay here ---------------------------
          if $B [ -n "$KBDIR" ]; then
            {
              echo "== diag =="
              echo "date: $($B date)"
              echo "cmdline: $($B cat /proc/cmdline)"
              echo "-- /sys/class/udc:"
              $B ls -l /sys/class/udc 2>&1
              echo "-- gadget UDC file:"
              $B cat /sys/kernel/config/usb_gadget/g/UDC 2>&1
              echo "-- usb devices:"
              for d in /sys/bus/usb/devices/*; do
                v=$($B cat "$d/idVendor" 2>/dev/null) || continue
                echo "  $d $v:$($B cat "$d/idProduct" 2>/dev/null)"
              done
              echo "-- dmesg:"
              $B dmesg
            } > /mnt/kb/diag.txt 2>/dev/null
            echo "init: idle, diag written" >> $STAGE 2>/dev/null
          fi
          echo "init-stage: idle" > /dev/kmsg
          echo init: ramdisk is /, debug shell only > /dev/kmsg
          while :; do $B sleep 3600; done
          INIT
          chmod 755 initrd/init
          (cd initrd && find . | cpio -o -H newc --owner root:root | gzip -9 > ../out/initrd.cpio.gz)
          ls -la out/initrd.cpio.gz

          # UKI fixups: EFI-stub boot gets no ABL node fixups, so re-add
          # the ramoops region for post-mortem dmesg via pstore. The
          # memory map is a separate, choose-one overlay per machine:
          # the source dtb carries a placeholder reg (size 0 = instant
          # black screen without one), and a 12G capture applied on a
          # 16G unit maps ~30MB of ghost pages that end in a synchronous
          # external abort. Compose region + memory + ramoops per unit.
          dtc -@ -I dts -O dtb -o out/uki-fixes.dtbo \
            "$DTS/kaanapali-oneplus-infiniti-uki-fixes.dts"
          for spec in china:cn global:gl; do
            src="${spec%%:*}"
            tag="${spec##*:}"
            for mem in 12g 16g; do
              fdtoverlay -i "$DTS/kaanapali-oneplus-infiniti-common.dtb" \
                -o "out/kaanapali-$tag-$mem.dtb" \
                "$DTS/kaanapali-oneplus-infiniti-$src.dtbo" \
                "$DTS/kaanapali-oneplus-infiniti-memory-$mem.dtbo" \
                out/uki-fixes.dtbo
            done
            # The UKI ships the 16G map only: the three-piece path picks
            # the dtb per unit, a UKI has to embed exactly one.
            ukify build \
              --linux=arch/arm64/boot/Image \
              --initrd=out/initrd.cpio.gz \
              --devicetree="out/kaanapali-$tag-16g.dtb" \
              --cmdline='earlycon console=ttyGS0 console=tty0 loglevel=8 log_buf_len=16M panic=30 clk_ignore_unused pd_ignore_unused memmap=4M$0xB8000000' \
              --uname="$(cat include/config/kernel.release)" \
              --output="out/kaanapali-$tag-16g.efi"
          done
          ls -la out/*.dtb out/*.efi

      - name: Package
        run: |
          mkdir -p out
          cp arch/arm64/boot/Image out/
          cp .config out/config
          # The same initramfs under the name SfbKernelBoot reads it by.
          cp out/initrd.cpio.gz out/ramdisk
          find arch/arm64/boot/dts/qcom -maxdepth 1 -name 'kaanapali-oneplus-infiniti*' \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp -v {} out/ \;
          {
            echo "commit: $GITHUB_SHA"
            echo "branch: $GITHUB_REF_NAME"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "date: $(date -u +%FT%TZ)"
            echo "runner: $RUNNER_ARCH"
            echo "ccache: $(CCACHE_DIR=$CCACHE_DIR ccache -s 2>/dev/null | grep -E 'cache hit|Cache size' || true)"
          } > out/BUILD_INFO.txt
          tar -C out -czf kaanapali-7.2-build.tar.gz .
          ls -la out/ kaanapali-7.2-build.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaanapali-7.2
          path: out/
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 7.2-latest
          name: "kaanapali 7.2 latest"
          prerelease: true
          overwrite_files: true
          body: |
            Rolling build of branch `7.2` for OnePlus 15 (kaanapali).
            Every build output is attached as an individual file: Image,
            kaanapali-cn/gl-{12g,16g}.dtb (region + matching memory map +
            ramoops), the kaanapali*.dtb/.dtbo set, UKIs, config,
            BUILD_INFO.txt and `ramdisk` (the pure-boot debug initramfs,
            same bytes as initrd.cpio.gz) -- with the same files also
            bundled in kaanapali-7.2-build.tar.gz.
            `ramdisk` + Image + dtb are the `\efisp` three-piece for
            SfbKernelBoot; the ramdisk is the root (no rootfs handoff).
            Pick the dtb matching the unit's RAM: kaanapali-cn-12g.dtb /
            kaanapali-cn-16g.dtb (same for gl); the 12G map on a 16G
            unit maps ghost pages and dies in a synchronous external
            abort.
            `kaanapali-cn-16g.efi` / `kaanapali-gl-16g.efi`: bootable
            UKIs for `fastboot boot` (16G memory map).
            Last commit: ${{ github.sha }}
          files: |
            kaanapali-7.2-build.tar.gz
            out/*
