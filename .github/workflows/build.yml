name: build

on:
  push:
    branches: ["7.2"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison libssl-dev libelf-dev bc

      - name: Configure
        run: |
          make ARCH=arm64 defconfig
          ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/kaanapali.config
          make ARCH=arm64 olddefconfig

      - name: Build Image
        run: make ARCH=arm64 -j"$(nproc)" Image

      - name: Build DTBs
        run: make ARCH=arm64 -j"$(nproc)" dtbs

      - name: Package
        run: |
          mkdir -p out
          cp arch/arm64/boot/Image out/
          cp .config out/config
          find arch/arm64/boot/dts/qcom -maxdepth 1 -name 'kaanapali-oneplus-infiniti*' \( -name '*.dtb' -o -name '*.dtbo' \) -exec cp -v {} out/ \;
          {
            echo "commit: $GITHUB_SHA"
            echo "branch: $GITHUB_REF_NAME"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "date: $(date -u +%FT%TZ)"
            echo "runner: $RUNNER_ARCH"
          } > out/BUILD_INFO.txt
          tar -C out -czf kaanapali-7.2-build.tar.gz .
          ls -la out/ kaanapali-7.2-build.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaanapali-7.2
          path: out/
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 7.2-latest
          name: "kaanapali 7.2 latest"
          prerelease: true
          overwrite_files: true
          body: |
            Rolling build of branch `7.2` for OnePlus 15 (kaanapali).
            Image + DTBs + .config + BUILD_INFO.txt inside the tarball.
            Last commit: ${{ github.sha }}
          files: kaanapali-7.2-build.tar.gz
